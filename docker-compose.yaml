services:
  app:
    build:
      context: .
      target: development
    container_name: go-tickets-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - .env
    environment:
      # host.docker.internal resolves to your machine's localhost from inside the container
      DSN: "host=host.docker.internal user=postgres password=4219 dbname=go-tickets port=5432 sslmode=disable TimeZone=Asia/Shanghai"
    volumes:
      - .:/app
      - go_modules:/go/pkg/mod
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux; no-op on Mac/Windows

volumes:
  go_modules: